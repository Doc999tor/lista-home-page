<!DOCTYPE html>
<html lang="he-IL" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>הפנייה התקבלה — Lista CRM</title>
  <meta name="description" content="הבקשה שלכם התקבלה. נחזור אליכם בקרוב.">
  <link rel="canonical" href="https://lista-crm.com/public/contact-thank-you.html">
  <link rel="icon" href="/public/assets/favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="/public/assets/opensanshebrew.css">
  <link rel="stylesheet" href="/public/seo/assets/seo.css">
  <style>
    .thank-you-header .site-header__inner {
      justify-content: center;
    }

    .success-panel {
      text-align: center;
    }

    .success-panel .success-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(4rem, 12vw, 5.5rem);
      height: clamp(4rem, 12vw, 5.5rem);
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      background: linear-gradient(145deg, #61fd7d 0%, #25cf43 100%);
      box-shadow: 0 8px 28px rgba(37, 207, 67, 0.28);
    }

    .success-panel .success-icon svg {
      width: 55%;
      height: 55%;
    }

    .success-panel h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.5rem, 4.5vw, 2rem);
      line-height: 1.3;
      color: var(--seo-purple);
      font-weight: 700;
    }

    .success-panel .lead {
      margin: 0 0 1.5rem;
      color: var(--seo-muted);
      font-size: clamp(1rem, 2.8vw, 1.125rem);
      line-height: 1.65;
      max-width: 28rem;
      margin-inline: auto;
    }

    .success-panel .cta-row {
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">דילוג לתוכן</a>
  <header class="site-header thank-you-header">
    <div class="site-header__inner">
      <a class="brand" href="/">
        <img class="brand__logo" src="/public/assets/lista-crm-wordmark.svg" width="117" height="24" alt="Lista CRM" decoding="async" />
      </a>
    </div>
  </header>
  <main id="main">
    <article class="success-panel">
      <div class="success-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5" />
        </svg>
      </div>
      <h1>הפנייה התקבלה בהצלחה</h1>
      <p class="lead">ניצור איתך קשר בהקדם האפשרי</p>
      <div class="cta-row">
        <a class="btn btn--primary" href="/">חזרה לאתר הראשי</a>
        <a class="btn btn--ghost" href="/public/pricing.html">מחירון</a>
      </div>
    </article>
  </main>
  <footer class="site-footer">
    <p>© Lista Smart Manager · <a href="/public/contact_us.html">טופס יצירת קשר</a></p>
    <p><a href="https://atzma.im/public/legal/privacy_policy.html" rel="noopener noreferrer">מדיניות פרטיות</a> · <a href="https://atzma.im/public/legal/terms_of_use.html" rel="noopener noreferrer">תנאי שימוש</a></p>
  </footer>
  <script src="/public/assets/query-param-propagation.js" defer></script>
</body>
</html>
