server {
    listen 443 ssl http2;
    server_name wp.lista-app.com;

    # TLS configuration is intentionally omitted here.
    # Keep certbot-managed directives in your server-specific nginx site file.

    location = /lst/support {
        proxy_pass http://127.0.0.1:8083/support;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /lst/contact_us {
        proxy_pass http://127.0.0.1:8083/contact_us;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /lst/healthz-gn5bre {
        proxy_pass http://127.0.0.1:8083/healthz-gn5bre;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
