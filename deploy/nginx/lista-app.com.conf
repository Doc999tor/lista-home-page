server {
    server_name lista-crm.com;

    if ($server_protocol = "HTTP/1.0") {
        return 444;
    }

    location = / {
        root /var/www/lista-crm.com;
        try_files /public/index.html =404;
    }

    location = /robots.txt {
        root /var/www/lista-crm.com;
        try_files /public/robots.txt =404;
    }

    location = /sitemap.xml {
        root /var/www/lista-crm.com;
        try_files /public/sitemap.xml =404;
    }

    location = /pricing/ {
        return 301 /public/pricing.html;
    }
    location = /pricing {
        return 301 /public/pricing.html;
    }
    location = /הצטרפות-והשארת-פרטים/ {
        return 301 /public/contact_us.html;
    }
    location = /הצטרפות-והשארת-פרטים {
        return 301 /public/contact_us.html;
    }
    location = /support/ {
        return 301 /public/support.html;
    }

    location ~* ^/public/.*\.min\..+$ {
        root /var/www/lista-crm.com;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public/ {
        alias /var/www/lista-crm.com/public/;
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    error_page 429 = @rate_limited;

    location /contact_us {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location /support {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location /whatsapp-click {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location = /healthz-gn5bre {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location @rate_limited {
        default_type application/json;
        add_header X-RateLimit-Limit 10 always;
        add_header X-RateLimit-Remaining 0 always;
        add_header X-RateLimit-Reset $msec always;
        return 429 '{"error":"Rate limit exceeded. Please wait before making additional requests."}';
    }

    location / {
        return 444;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lista-crm.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lista-crm.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = lista-crm.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name lista-crm.com;


    listen 80;
    return 404; # managed by Certbot


}
